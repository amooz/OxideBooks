[workspace]
members = [
    "crates/core",
    "crates/db",
    "crates/api",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OxideBooks Contributors"]
license = "AGPL-3.0"
repository = "https://github.com/amooz/oxidebooks"

[workspace.dependencies]
# Internal crates
oxidebooks-core = { path = "crates/core" }
oxidebooks-db = { path = "crates/db" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "request-id"] }

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "migrate",
    "uuid",
    "time",
    "json",
    "rust_decimal",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }

# Decimal arithmetic (exchange rates, precise numeric columns)
rust_decimal = { version = "1", features = ["serde-with-str"] }

# IDs & time
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = [
    "serde",
    "serde-well-known",
    "formatting",
    "parsing",
    "macros",
] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Config
config = "0.14"
dotenvy = "0.15"

# HTTP body utilities (used in integration tests)
http-body-util = "0.1"

# HTTP client (OIDC discovery, SAML metadata fetch)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# OIDC / OAuth2
openidconnect = { version = "4", features = ["reqwest"] }

# SAML XML serialization / deserialization
quick-xml = { version = "0.37", features = ["serialize"] }

# Compression for SAML HTTP-Redirect binding (deflate)
flate2 = "1"

# Random token generation (SCIM tokens, OIDC state)
rand = { version = "0.8", features = ["std"] }

# Base64 (SAML XML encoding, SCIM)
base64 = "0.22"

# URL percent-encoding (SAML HTTP-Redirect binding)
urlencoding = "2"

# SAML xmldsig signature verification (pure Rust, no C FFI)
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
hmac = "0.12"
x509-cert = { version = "0.2", features = ["pem"] }

# Per-IP rate limiting for auth endpoints
tower_governor = "0.4"

# CSV serialization (export endpoints)
csv = "1"

# TOTP two-factor authentication
totp-rs = { version = "5", features = ["gen_secret", "qr"] }
