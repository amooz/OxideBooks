[workspace]
members = [
    "crates/core",
    "crates/db",
    "crates/api",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OxideBooks Contributors"]
license = "AGPL-3.0"
repository = "https://github.com/amooz/oxidebooks"

[workspace.dependencies]
# Internal crates
oxidebooks-core = { path = "crates/core" }
oxidebooks-db = { path = "crates/db" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "request-id"] }

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "migrate",
    "uuid",
    "time",
    "json",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }

# IDs & time
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = [
    "serde",
    "serde-well-known",
    "formatting",
    "parsing",
    "macros",
] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Config
config = "0.14"
dotenvy = "0.15"

# HTTP body utilities (used in integration tests)
http-body-util = "0.1"
