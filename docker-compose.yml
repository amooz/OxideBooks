name: oxidebooks

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oxidebooks
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: oxidebooks
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxidebooks"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Expose only on localhost by default — remove for external access
      - "127.0.0.1:5432:5432"

  # ─── OxideBooks API ─────────────────────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      OXIDEBOOKS__DATABASE__URL: "postgresql://oxidebooks:${DB_PASSWORD:-changeme}@db:5432/oxidebooks"
      OXIDEBOOKS__AUTH__JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      OXIDEBOOKS__SERVER__HOST: "0.0.0.0"
      OXIDEBOOKS__SERVER__PORT: "3000"
      OXIDEBOOKS__APP__REGISTRATION_OPEN: "${REGISTRATION_OPEN:-true}"
      RUST_LOG: "info,oxidebooks=debug"
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Optional: Adminer (DB admin UI) ────────────────────────────────────────
  adminer:
    image: adminer:latest
    restart: unless-stopped
    profiles: ["dev"]
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pg_data:
